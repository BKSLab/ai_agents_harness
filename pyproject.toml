[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-harness"
version = "0.3.0"
description = "Portable skills, reliable tools and installation checks for coding agents"
requires-python = ">=3.11"
dependencies = ["tomlkit>=0.13.3,<1", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
agent-harness = "harness_cli.main:main"

[tool.setuptools]
packages = ["harness_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
