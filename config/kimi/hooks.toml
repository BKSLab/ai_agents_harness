# Фрагмент для ~/.kimi-code/config.toml — хуки Kimi Code.
# Установщик объединяет эти правила с существующей конфигурацией и ведёт
# квитанцию владения. При ручной настройке замени <PYTHON> и <REPO> на
# абсолютные пути (в Windows Git Bash — прямые слэши, например C:/work/...).
# Не копируй плейсхолдеры буквально и не заменяй весь config.toml этим фрагментом.
# Документация: https://www.kimi.com/code/docs/en/kimi-code-cli/customization/hooks.html
#
# Хуки fail-open: ошибка скрипта разрешает операцию. Это подсказки и
# дополнительный барьер, а не единственная защита.

# Распознаёт прямые чтения/отправку файлов с известными секретными именами.
# .env.example и обычное использование окружения приложением разрешены.
# Это неполный фильтр буквальных команд, не парсер всех shell и не sandbox.
[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "'<PYTHON>' -E -s -X utf8 '<REPO>/hooks/protect_secrets.py'"
timeout = 5

# После правки .py-файла запускает ruff без исправлений: passed/failed/skipped/error.
# Результат lint не является квитанцией тестов или независимого ревью.
[[hooks]]
event = "PostToolUse"
matcher = "Edit|Write"
command = "'<PYTHON>' -E -s -X utf8 '<REPO>/hooks/lint_on_edit.py'"
timeout = 30

# Проверяет сохранённые доказательства и точное разрешение для commit/push
# активной задачи harness. В проектах без активной задачи разрешает команду.
# Сложные распознанные shell-формы в управляемом проекте требуют отдельных
# буквальных git-команд; псевдонимы и косвенные скрипты фильтр не изолирует.
[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "'<PYTHON>' -E -s -X utf8 '<REPO>/hooks/git_gate.py'"
timeout = 10
